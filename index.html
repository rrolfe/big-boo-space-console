<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070c1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Big Boo Space">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Explore six extraordinary worlds at the Big Boo space console.">
  <title>Big Boo · Space Console</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='23' fill='%236ae4ff'/%3E%3Cpath d='M4 43c14-12 42-18 56-20' stroke='%23ffca67' stroke-width='7' fill='none'/%3E%3C/svg%3E">
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#f5f8ff;background:#070c1c;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% -25%,#174070 0,#0b1835 38%,#070c1c 78%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.48;background-image:radial-gradient(1px 1px at 16px 28px,#fff 98%,transparent),radial-gradient(1px 1px at 110px 92px,#b1dfff 98%,transparent),radial-gradient(2px 2px at 78px 14px,#fff 98%,transparent);background-size:153px 131px,211px 177px,277px 231px}button{font:inherit;cursor:pointer}main{position:relative;max-width:1120px;margin:0 auto;padding:28px 22px 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand{font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#a8ebff;font-size:.9rem}.status{border:1px solid #386783;background:#102840;color:#c9f1ff;border-radius:100px;padding:9px 13px;font-size:.84rem;font-weight:700;letter-spacing:.08em}.status:before{content:"";display:inline-block;background:#65ffbf;width:8px;height:8px;border-radius:50%;margin-right:9px;box-shadow:0 0 10px #65ffbf}h1{font-size:clamp(2rem,5vw,3.8rem);line-height:1.04;letter-spacing:-.04em;margin:8px 0 8px}header p{margin:0 0 24px;color:#aec4dc;font-size:1.08rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.world{position:relative;min-height:238px;padding:0;overflow:hidden;text-align:left;color:inherit;border:1px solid #416285;border-radius:22px;background:linear-gradient(150deg,#193e5a,#101b35 64%,#12172e);box-shadow:inset 0 1px #ffffff18,0 14px 35px #0005;transition:transform .2s,border-color .2s,box-shadow .2s}.world:hover,.world:focus-visible{transform:translateY(-4px);border-color:#87e8fa;box-shadow:0 0 0 3px #65dfff30,0 18px 40px #0007;outline:0}.world:active{transform:scale(.98)}.planet{display:block;position:absolute;left:50%;top:43%;width:min(78%,225px);aspect-ratio:1;transform:translate(-50%,-50%);background-image:url('planets.png');background-size:300% 200%;background-repeat:no-repeat;filter:drop-shadow(0 10px 25px #0008);transition:transform .45s}.world:hover .planet{transform:translate(-50%,-50%) scale(1.08)}.world:after{content:"";position:absolute;inset:38% 0 0;background:linear-gradient(transparent,#081224 90%);pointer-events:none}.word{position:absolute;z-index:1;left:20px;right:18px;bottom:18px}.word strong{display:block;font-size:clamp(1.14rem,2.1vw,1.55rem);line-height:1.13}.word small{display:block;margin-top:5px;color:#b5d0e7;font-size:.86rem}.word em{display:inline-block;margin-top:9px;color:#76e9ff;font-size:.81rem;font-weight:800;font-style:normal;letter-spacing:.07em}.world:last-child{border-color:#edbe6b;background:linear-gradient(140deg,#503334,#2a203a 65%,#151c31)}.world:last-child .word small{color:#ffdeaa}.note{margin:19px 0 0;color:#98acc2;font-size:.85rem}.overlay{position:fixed;inset:0;z-index:5;background:#050916ed;display:none;align-items:center;justify-content:center;padding:18px}.overlay.open{display:flex}.detail{position:relative;width:min(100%,780px);max-height:calc(100dvh - 36px);overflow:auto;border:1px solid #5793b7;border-radius:28px;background:radial-gradient(circle at 50% 20%,#1c4670,#111e3c 50%,#0b142b 100%);box-shadow:0 25px 75px #000b;padding:24px 34px 30px;text-align:center}.back{position:absolute;z-index:2;top:18px;left:18px;background:#183552;color:white;border:1px solid #6399b5;border-radius:100px;padding:12px 17px;font-weight:700}.back:focus-visible{outline:3px solid #fff}.detail .planet{position:relative;left:auto;top:auto;width:min(57vw,330px);max-width:100%;margin:0 auto -3px;transform:none;animation:orbit 11s ease-in-out infinite}.detail .planet.saturn{animation:orbit 14s ease-in-out infinite}@keyframes orbit{0%,100%{transform:perspective(900px) rotateY(-8deg) rotate(-3deg)}50%{transform:perspective(900px) rotateY(8deg) rotate(3deg)}}.eyebrow{margin:2px 0 7px;color:#6ae4ff;font-weight:800;letter-spacing:.18em;font-size:.8rem}.detail h2{font-size:clamp(2rem,6vw,3.25rem);line-height:1.06;margin:0 0 11px;letter-spacing:-.035em}.description{max-width:570px;margin:0 auto;color:#e5edf9;font-size:clamp(1.1rem,2.6vw,1.42rem);line-height:1.48}.fiction{color:#ffcf87}.continue{display:block;margin:22px auto 0;background:#72e6ff;color:#08223a;border:0;border-radius:100px;padding:13px 28px;font-weight:900;font-size:1rem;min-height:49px}.continue:focus-visible{outline:3px solid #fff;outline-offset:3px}@media(max-width:680px){main{padding:19px 13px 30px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.world{min-height:200px;border-radius:17px}.word{left:12px;right:9px;bottom:13px}.word small{font-size:.76rem}.planet{width:92%}.detail{padding:67px 20px 27px}.detail .planet{width:min(66vw,290px)}}@media(max-width:370px){.grid{gap:8px}.world{min-height:180px}.status{font-size:.7rem;padding:8px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<main>
  <div class="top"><span class="brand">Big Boo · Space Console</span><span class="status">READY TO EXPLORE</span></div>
  <header><h1>Choose a Destination</h1><p>Tap a destination to discover what makes it amazing.</p></header>
  <div class="grid" id="grid"></div>
  <p class="note">Real planets are shown with artist illustrations. Tatooine is from Star Wars.</p>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="detail-title" aria-hidden="true">
  <article class="detail"><button class="back" id="back" type="button">← All planets</button><div class="planet" id="large-planet" aria-hidden="true"></div><p class="eyebrow" id="eyebrow"></p><h2 id="detail-title"></h2><p class="description" id="description"></p><button class="continue" id="continue" type="button">Explore another planet</button></article>
</div>
<script>
const worlds=[
 {name:'Mars',short:'The red planet',type:'OUR SOLAR SYSTEM',pos:'0% 0%',description:'Mars is a dusty red world with giant mountains and deep canyons. Robots have driven across its ground to look for signs that water was once there.'},
 {name:'Saturn',short:'The planet with giant rings',type:'OUR SOLAR SYSTEM',pos:'50% 0%',description:'Saturn has huge rings made of countless pieces of ice and rock. Its icy moon Enceladus sprays water into space like a giant fountain!'},
 {name:'Diamond Planet',short:'Could diamonds hide inside?',type:'DEEP SPACE · 55 CANCRI E',pos:'100% 0%',description:'This planet is so hot that rock may melt into oceans of lava. Some scientists have wondered if diamonds could be hidden deep inside it. We are still learning what it is made of.'},
 {name:'Glass-Rain Planet',short:'A wild blue storm world',type:'DEEP SPACE · HD 189733 B',pos:'0% 100%',description:'This blue planet has winds that can race at 5,400 miles per hour. Scientists think tiny bits of glass may blow sideways through its clouds. Imagine a storm like that!'},
 {name:'Marshmallow Planet',short:'As light as a marshmallow',type:'DEEP SPACE · TOI-3757 B',pos:'50% 100%',description:'This giant planet is mostly gas. For its size, it is so light that scientists compare it to a marshmallow! It is not made of marshmallows, though.'},
 {name:'Tatooine',short:'Your next stop · Star Wars',type:'FICTIONAL DESTINATION',pos:'100% 100%',description:'Two suns shine over this desert planet in Star Wars. Jabba the Hutt lives in a palace here. Your next adventure begins on Tatooine!'}
];
const grid=document.getElementById('grid'),overlay=document.getElementById('overlay');let previousFocus;
worlds.forEach((w,i)=>{const button=document.createElement('button');button.className='world';button.type='button';button.setAttribute('aria-label',`Explore ${w.name}`);button.innerHTML=`<span class="planet" aria-hidden="true"></span><span class="word"><strong>${w.name}</strong><small>${w.short}</small><em>EXPLORE →</em></span>`;button.querySelector('.planet').style.backgroundPosition=w.pos;button.addEventListener('click',()=>show(i));grid.appendChild(button)});
function show(i){const w=worlds[i];previousFocus=document.activeElement;const planet=document.getElementById('large-planet');planet.style.backgroundPosition=w.pos;planet.classList.toggle('saturn',i===1);document.getElementById('eyebrow').textContent=w.type;document.getElementById('eyebrow').classList.toggle('fiction',i===5);document.getElementById('detail-title').textContent=w.name;document.getElementById('description').textContent=w.description;overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.getElementById('back').focus()}
function close(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.style.overflow='';previousFocus?.focus()}
document.getElementById('back').onclick=close;document.getElementById('continue').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))close();if(e.key==='Tab'&&overlay.classList.contains('open')){const controls=[document.getElementById('back'),document.getElementById('continue')];if(e.shiftKey&&document.activeElement===controls[0]){e.preventDefault();controls[1].focus()}else if(!e.shiftKey&&document.activeElement===controls[1]){e.preventDefault();controls[0].focus()}}});
</script>
</body>
</html>
